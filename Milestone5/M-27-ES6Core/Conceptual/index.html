<!DOCTYPE html>
<html>
<head>
  <title>Simple Dropdown Menu</title>
  <style>
   
    /* .navbar {
      background-color: #333;
      overflow: hidden;
    } */

    .dropdown a {
      float: left;
      color: white;
      padding: 14px 16px;
      text-decoration: none;
    }

    .navbar a:hover {
      background-color: #555;
    }

    .dropdown {
      float: left;
      margin-top:  40px;
    }

    .dropdown .dropbtn {
     background-color: rgb(75, 75, 216);
     padding: 15px;
      cursor: pointer;
      border-radius: 10px;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
    }

    .dropdown-content a {
      float: none;
      color: black;
      padding: 12px 16px;
      display: block;
      text-decoration: none;
    }

    .dropdown-content a:hover {
      background-color: #a34242;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>

 

    <div class="dropdown">
      <a class="dropbtn">Technology</a>
      <div class="dropdown-content">
        <a href="#">Computer</a>
        <a href="#">Civil</a>
        <a href="#">Food</a>
      </div>
    </div>

  </div>

</body>
</html>
